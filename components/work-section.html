<!-- ===== SECTION STYLES (paste) — the one scoped block; every selector under [data-vbwork2], every class vw2- ===== -->
<style>
[data-vbwork2]{position:relative;z-index:2;box-sizing:border-box;background:#04060d;overflow:clip;padding:clamp(90px,13vh,160px) clamp(20px,5vw,90px) clamp(80px,10vh,130px);font-family:'Onest',system-ui,sans-serif;color:#eaf0ff}
[data-vbwork2] *,[data-vbwork2] *::before,[data-vbwork2] *::after{box-sizing:border-box}
[data-vbwork2] button{margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
[data-vbwork2] button:focus-visible{outline:2px solid #b6f500;outline-offset:3px}
[data-vbwork2] img{display:block}
[data-vbwork2] .vw2-wrap{max-width:1400px;margin:0 auto}
[data-vbwork2] .vw2-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header (site-wide pattern) ---------- */
[data-vbwork2] .vw2-head{margin-bottom:0} /* the filter bar's hairline is the list's top rule */
[data-vbwork2] .vw2-head-top{display:grid;gap:16px;margin-bottom:16px}
[data-vbwork2] .vw2-eyebrow{display:block;margin-bottom:18px;font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#b6f500}
[data-vbwork2] .vw2-h2{margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,3.7vw,54px);font-weight:600;line-height:1.05;letter-spacing:-.035em;color:#f6f9ff}
[data-vbwork2] .vw2-accent{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:#b6f500}
[data-vbwork2] .vw2-sub{margin:0 0 16px;max-width:380px;font-size:15px;line-height:1.6;color:#8da0c4}
[data-vbwork2] .vw2-sub-d{display:none} /* the approved sentence talks about the monitor: only shown where the monitor exists */
[data-vbwork2] .vw2-stats{display:flex;flex-wrap:wrap;gap:6px 0;margin:0}
[data-vbwork2] .vw2-stats div{display:flex;align-items:baseline;gap:8px}
[data-vbwork2] .vw2-stats div + div::before{content:"\00b7";order:-2;margin:0 6px;color:#8da0c4}
[data-vbwork2] .vw2-stats dd{order:-1;margin:0;font:400 27px/1 'Instrument Serif',serif;font-style:italic;color:#f6f9ff}
[data-vbwork2] .vw2-stats dt{font-size:13px;color:#8da0c4}
[data-vbwork2] .vw2-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:12px 20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
[data-vbwork2] .vw2-filters{display:flex;flex-wrap:wrap;gap:8px}
[data-vbwork2] .vw2-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid rgba(255,255,255,.14);border-radius:100px;background:rgba(255,255,255,.035);color:#c9d5ee;font-size:15px;font-weight:500;line-height:1;transition:transform .2s ease}
[data-vbwork2] .vw2-chip b{font:400 18px/1 'Instrument Serif',serif;font-style:italic;color:#8da0c4}
[data-vbwork2] .vw2-chip[aria-pressed="true"]{border-color:#b6f500;background:#b6f500;color:#06140a;font-weight:600}
[data-vbwork2] .vw2-chip[aria-pressed="true"] b{color:#06140a}
[data-vbwork2] .vw2-chip:active{transform:scale(.97)}
[data-vbwork2] .vw2-status{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8da0c4}

/* ---------- list: base = compact media rows (phone / tablet / short viewports) ---------- */
[data-vbwork2] .vw2-list{list-style:none;margin:0;padding:0;transition:opacity .12s linear}
[data-vbwork2] .vw2-list.vw2-out{opacity:0}
/* li = mask + dim target, button = the thing that slides: entrance and dim never fight over one opacity */
[data-vbwork2] .vw2-item{display:block;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.1);transition:opacity .3s ease}
[data-vbwork2] .vw2-item[hidden]{display:none}
[data-vbwork2] .vw2-row{position:relative;display:block;width:100%}
[data-vbwork2] .vw2-row:focus-visible{outline-offset:-3px}
[data-vbwork2] .vw2-grid{position:relative;z-index:1;display:grid;grid-template-columns:92px minmax(0,1fr) 44px;column-gap:14px;align-items:center;min-height:88px;padding:12px 0}
[data-vbwork2] .vw2-num{display:none;font:400 21px/1 'Instrument Serif',serif;font-style:italic;color:#8da0c4}
[data-vbwork2] .vw2-thumb{position:relative;display:block;width:92px;height:66px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#080d1a}
[data-vbwork2] .vw2-thumb img,[data-vbwork2] .vw2-strip img{width:100%;height:100%;object-fit:cover}
[data-vbwork2] .vw2-t-film::after{content:"";position:absolute;left:7px;bottom:7px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #fff;opacity:.9;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
[data-vbwork2] .vw2-txt{display:block;min-width:0}
[data-vbwork2] .vw2-title{display:block;font-family:'Space Grotesk',sans-serif;font-size:clamp(19px,1.9vw,30px);font-weight:600;line-height:1.12;letter-spacing:-.025em;color:#f6f9ff;overflow-wrap:break-word;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
[data-vbwork2] .vw2-kind{display:inline-block;padding:4px 10px;border:1px solid rgba(127,212,255,.4);border-radius:100px;font-size:11.5px;font-weight:600;line-height:1.1;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:#7fd4ff}
[data-vbwork2] .vw2-kind.vw2-k-film{border-color:rgba(182,245,0,.4);color:#b6f500}
[data-vbwork2] .vw2-kind.vw2-k-mix{border-color:rgba(255,255,255,.28);color:#eaf0ff}
[data-vbwork2] .vw2-count{font-size:13px;line-height:1.3;color:#8da0c4}
[data-vbwork2] .vw2-strip{display:none}
[data-vbwork2] .vw2-strip i{display:block;width:50px;height:30px;border-radius:5px;overflow:hidden;background:#080d1a}
[data-vbwork2] .vw2-arrow{position:relative;display:block;width:44px;height:44px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.18);color:#f6f9ff}
[data-vbwork2] .vw2-arrow::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:#b6f500;transform:scale(0);transition:transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-arrow svg{position:absolute;top:13px;left:13px;width:16px;height:16px}
[data-vbwork2] .vw2-row:focus-visible .vw2-arrow,[data-vbwork2] .vw2-row:active .vw2-arrow{color:#06140a}
[data-vbwork2] .vw2-row:focus-visible .vw2-arrow::before{transform:scale(1)}
/* pressed feedback (tap highlight is off, so a phone tap needs its own) */
[data-vbwork2] .vw2-row:active .vw2-grid{background:rgba(182,245,0,.06)}
[data-vbwork2] .vw2-row:active .vw2-arrow::before{transform:scale(1);transition-duration:.15s}
[data-vbwork2] .vw2-row.vw2-fin{animation:vw2-fin .12s ease backwards}
@keyframes vw2-fin{from{opacity:0;transform:translateY(8px)}}
[data-vbwork2] .vw2-mon{display:none}

@media (hover:hover){
  [data-vbwork2] .vw2-chip:hover{border-color:rgba(182,245,0,.6);background:rgba(182,245,0,.08);color:#f6f9ff}
  [data-vbwork2] .vw2-chip[aria-pressed="true"]:hover{border-color:#c8ff2e;background:#c8ff2e;color:#06140a}
  [data-vbwork2] .vw2-row:hover .vw2-arrow{color:#06140a}
  [data-vbwork2] .vw2-row:hover .vw2-arrow::before{transform:scale(1)}
  [data-vbwork2] .vw2-open:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(182,245,0,.6)}
  [data-vbwork2] .vw2-open:hover svg{transform:translateX(4px)}
  [data-vbwork2] .vw2-viewer:hover .vw2-openchip{transform:translateY(-3px);background:#b6f500;color:#06140a}
  [data-vbwork2] .vw2-seg:hover{opacity:.8}
}
/* clip segments are a mouse convenience only: never a 10px tap target on touch desktops (iPad landscape) */
@media (hover:none){
  [data-vbwork2] .vw2-seg i{pointer-events:none}
}

@media (min-width:520px){
  [data-vbwork2] .vw2-head-top{gap:24px;margin-bottom:clamp(26px,3.4vw,44px)}
  [data-vbwork2] .vw2-grid{grid-template-columns:30px 104px minmax(0,1fr) 44px;column-gap:16px;padding:16px 0}
  [data-vbwork2] .vw2-num{display:block;grid-column:1;grid-row:1 / span 2}
  [data-vbwork2] .vw2-thumb{grid-column:2;grid-row:1 / span 2;width:104px;height:74px}
  [data-vbwork2] .vw2-txt{grid-column:3;grid-row:1}
  [data-vbwork2] .vw2-strip{display:flex;gap:4px;grid-column:3;grid-row:2;margin-top:12px}
  [data-vbwork2] .vw2-strip:empty{display:none}
  [data-vbwork2] .vw2-arrow{grid-column:4;grid-row:1 / span 2}
}
/* tablet / short-desktop: the strip becomes three real frames in its own column, so the row's middle is never empty */
@media (min-width:768px){
  [data-vbwork2] .vw2-grid{grid-template-columns:30px 104px minmax(0,1fr) auto 44px}
  [data-vbwork2] .vw2-strip{grid-column:4;grid-row:1 / span 2;gap:6px;margin-top:0}
  [data-vbwork2] .vw2-strip i{width:84px;height:52px;border-radius:6px}
  [data-vbwork2] .vw2-arrow{grid-column:5}
}
@media (min-width:900px){
  /* anchored, not floating: the block's right edge is the content (and monitor) edge, its left edge is a drawn rule */
  [data-vbwork2] .vw2-head-top{grid-template-columns:minmax(0,1fr) 380px;align-items:end;column-gap:clamp(28px,4vw,64px)}
  [data-vbwork2] .vw2-head-r{padding-left:24px;border-left:1px solid rgba(255,255,255,.14)}
  [data-vbwork2] .vw2-sub{max-width:none}
}

/* ---------- program monitor (only ever displayed inside the desktop query below) ---------- */
[data-vbwork2] .vw2-mon-in{position:relative;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 40px 80px -48px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.09)}
/* ambient light in the site blue; static, behind the card, clipped by the root's overflow:clip */
[data-vbwork2] .vw2-mon-in::before{content:"";position:absolute;top:-14%;right:-10%;bottom:-14%;left:-10%;z-index:-1;pointer-events:none;background:radial-gradient(55% 50% at 62% 38%,rgba(47,107,255,.2),transparent 70%)}
[data-vbwork2] .vw2-mon-bar{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:12px;min-height:30px;margin-bottom:12px;padding:0 4px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8da0c4}
[data-vbwork2] .vw2-mon-name{position:relative;min-width:0;padding-left:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-vbwork2] .vw2-mon-name::before{content:"";position:absolute;left:0;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:#b6f500}
[data-vbwork2] .vw2-mon-in.vw2-live .vw2-mon-name::before{animation:vw2-rec 1.9s ease-in-out infinite} /* pulses only while the flipbook is really playing */
@keyframes vw2-rec{50%{opacity:.3}}
[data-vbwork2] .vw2-mon-r{display:inline-flex;flex:none;align-items:center;gap:12px}
[data-vbwork2] .vw2-ctr{white-space:nowrap;font-variant-numeric:tabular-nums}
/* max-height keeps the whole monitor (incl. the Open button) inside the viewport; contain + backdrop absorb the ratio change.
   Budget: chrome around the viewer is <= 259px (2-line title + tags), sticky top <= 121px whenever this clamp is the limit. */
[data-vbwork2] .vw2-viewer{position:relative;display:block;width:100%;aspect-ratio:16/10;min-height:190px;max-height:calc(100vh - 380px);border-radius:14px;overflow:hidden;background:#080d1a}
[data-vbwork2] .vw2-viewer::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 -90px 70px -50px rgba(4,6,13,.5)}
[data-vbwork2] .vw2-back{position:absolute;top:-12%;left:-12%;width:124%;height:124%;object-fit:cover;filter:blur(22px) saturate(1.35);opacity:.62}
/* three-up for tall frames (shorts, emailers): neighbours of the current frame flank it, so the viewer is image, not murk */
[data-vbwork2] .vw2-side{display:none;position:absolute;top:9%;height:82%;width:auto;aspect-ratio:9/16;object-fit:cover;border-radius:8px;opacity:.4}
[data-vbwork2] .vw2-side-l{right:70%}
[data-vbwork2] .vw2-side-r{left:70%}
[data-vbwork2] .vw2-viewer.vw2-tall .vw2-side{display:block}
[data-vbwork2] .vw2-main{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
[data-vbwork2] .vw2-viewer.vw2-blank img{opacity:0} /* project changed and its first frame is not decoded yet: cut to black, never a stale frame */
[data-vbwork2] .vw2-flash{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;opacity:0;pointer-events:none}
[data-vbwork2] .vw2-flash.vw2-go{animation:vw2-flash .22s linear}
@keyframes vw2-flash{0%{opacity:0}35%{opacity:.16}100%{opacity:0}}
[data-vbwork2] .vw2-openchip{position:absolute;z-index:2;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:100px;background:rgba(4,6,13,.66);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:11.5px;font-weight:600;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:#f6f9ff;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-openchip svg{width:13px;height:13px}
/* clip strip: segment length = frame count. Only the 10px bar is hover-reactive (and needs a 250ms dwell), so a pointer
   travelling from the viewer to "Open project" cannot swap the project on its way. */
[data-vbwork2] .vw2-clips{position:relative;display:flex;gap:3px;margin-top:12px}
[data-vbwork2] .vw2-seg{position:relative;display:block;flex:1 1 0;min-width:0;height:22px;opacity:.35;pointer-events:none;transition:opacity .25s ease}
[data-vbwork2] .vw2-seg i{position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:3px;overflow:hidden;background:#7fd4ff;pointer-events:auto;cursor:pointer}
[data-vbwork2] .vw2-seg.vw2-k-film i{background:#b6f500}
[data-vbwork2] .vw2-seg.vw2-k-mix i{background:linear-gradient(90deg,#7fd4ff 50%,#b6f500 50%)}
[data-vbwork2] .vw2-seg i::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;opacity:0;transform-origin:left center;transform:scaleX(var(--p,0))} /* frame progress: steps on the cut, never eases */
[data-vbwork2] .vw2-seg.vw2-on{opacity:1}
[data-vbwork2] .vw2-seg.vw2-on i::after{opacity:.5}
[data-vbwork2] .vw2-seg.vw2-off{opacity:.12}
[data-vbwork2] .vw2-seg.vw2-off i{pointer-events:none}
/* one travelling playhead: a full-width rail, so translateX(%) is a share of the strip and JS never has to measure it */
[data-vbwork2] .vw2-ph{position:absolute;left:0;right:0;bottom:13px;height:7px;pointer-events:none;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-ph::before{content:"";position:absolute;left:-5px;top:0;border-style:solid;border-width:7px 5px 0 5px;border-color:#b6f500 transparent transparent transparent}
[data-vbwork2] .vw2-cap{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;align-items:center;margin-top:16px;padding:0 4px 4px}
[data-vbwork2] .vw2-cap-l{min-width:0}
[data-vbwork2] .vw2-cap-l.vw2-swap{animation:vw2-swap .3s cubic-bezier(.2,.7,.3,1)}
@keyframes vw2-swap{from{opacity:0;transform:translateY(8px)}}
[data-vbwork2] .vw2-cap-head{display:flex;align-items:baseline;gap:12px}
[data-vbwork2] .vw2-cap-num{flex:none;font:400 clamp(22px,2vw,30px)/1 'Instrument Serif',serif;font-style:italic;color:#b6f500}
[data-vbwork2] .vw2-cap-title{margin:0;min-width:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,2.4vw,38px);font-weight:600;line-height:1.08;letter-spacing:-.03em;color:#f6f9ff;overflow-wrap:break-word;text-wrap:balance}
[data-vbwork2] .vw2-cap-tags{margin:8px 0 0;font-size:13px;line-height:1.5;color:#8da0c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* one line always: the card's bottom edge must not move between projects */
[data-vbwork2] .vw2-cap-count{margin:4px 0 0;font-size:13px;font-weight:600;line-height:1.5;color:#eaf0ff}
[data-vbwork2] .vw2-open{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:100px;background:#b6f500;color:#06140a;font-size:15px;font-weight:600;line-height:1;white-space:nowrap;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-open svg{flex:none;width:16px;height:16px;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
[data-vbwork2] .vw2-open:active{transform:scale(.98)}

/* ---------- DESKTOP: list left, docked monitor right. JS uses this exact query string. ---------- */
@media (min-width: 1024px) and (min-height: 560px){
  [data-vbwork2] .vw2-sub-d{display:inline}
  [data-vbwork2] .vw2-sub-m{display:none}
  [data-vbwork2] .vw2-body{display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr);column-gap:clamp(28px,4vw,64px);align-items:start}
  /* 96px clears the host header; taller screens centre the dock instead of leaving air under it. JS reads the computed top. */
  [data-vbwork2] .vw2-mon{display:block;position:sticky;top:clamp(96px,calc((100vh - 760px) / 2 + 48px),200px);align-self:start;margin-top:19px} /* 16px row padding + the thumb's 3px: monitor top registers with the first thumb */
  [data-vbwork2] .vw2-grid{grid-template-columns:34px 76px minmax(0,1fr) 44px;column-gap:16px;align-items:start;padding:16px 0 16px 16px}
  [data-vbwork2] .vw2-num{padding-top:3px;font-size:26px} /* sits on the title line, not mid-row */
  [data-vbwork2] .vw2-thumb{width:76px;height:54px;margin-top:3px}
  [data-vbwork2] .vw2-thumb img{transition:transform .6s cubic-bezier(.2,.7,.3,1)}
  [data-vbwork2] .vw2-strip{display:none}
  [data-vbwork2] .vw2-arrow{grid-column:4;align-self:center}
  [data-vbwork2] .vw2-row::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:#b6f500;transform:scaleY(0);transform-origin:center;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
  [data-vbwork2] .vw2-row::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(182,245,0,.08),rgba(182,245,0,0) 60%);opacity:0;transition:opacity .45s ease;pointer-events:none}
  [data-vbwork2] .vw2-item.vw2-on .vw2-row::before{transform:scaleY(1)}
  [data-vbwork2] .vw2-item.vw2-on .vw2-row::after{opacity:1}
  [data-vbwork2] .vw2-item.vw2-on .vw2-title{transform:translateX(10px)}
  [data-vbwork2] .vw2-item.vw2-on .vw2-num{color:#b6f500}
  [data-vbwork2] .vw2-item.vw2-on .vw2-thumb{border-color:rgba(182,245,0,.55)}
  [data-vbwork2] .vw2-item.vw2-on .vw2-thumb img{transform:scale(1.08)}
  [data-vbwork2] .vw2-item.vw2-on .vw2-arrow{color:#06140a}
  [data-vbwork2] .vw2-item.vw2-on .vw2-arrow::before{transform:scale(1)}
}
/* narrow + tall desktop: 24px-ish titles can wrap here, so reserve two lines and the card never changes height */
@media (min-width: 1024px) and (max-width: 1199px) and (min-height: 781px){
  [data-vbwork2] .vw2-cap-l{min-height:calc(2.16 * clamp(24px,2.4vw,38px) + 52px)}
}
/* short desktop (1366x650, 1440x900 minus browser chrome): spend the height on the picture, not the caption */
@media (min-width: 1024px) and (min-height: 560px) and (max-height: 780px){

<!-- ===== SECTION SCRIPT (paste) — strict ES5, one IIFE, reads scroll position only (passive listener + rAF), never scrolls the page ===== -->
<script>
(function () {
  'use strict';
  var root = document.querySelector('[data-vbwork2]');
  var WORK = window.VB_WORK;
  if (!root || !WORK || !WORK.length) { return; }

  var DESK = '(min-width: 1024px) and (min-height: 560px)';   // identical string in the CSS
  var FEATURED = ['podcast-videos', 'social-media-designs', 'wealthy-yt-ads', 'creative-designs', 'trailer-video'];
  var FLIP_MS = 950, INTENT_MS = 90, SEG_INTENT_MS = 250, SETTLE_MS = 110, FOCUS_GRACE_MS = 400, HYST_PX = 14;
  var ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';

  function mq(s) { return window.matchMedia ? window.matchMedia(s) : { matches: false }; }
  var mqDesk = mq(DESK), mqRed = mq('(prefers-reduced-motion: reduce)');   // .matches is read live, never cached

  function q(name) { return root.querySelector('[data-vw2="' + name + '"]'); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function imgs(p) { return p.images || []; }
  function vids(p) { return p.videos || []; }
  function countLabel(p) {
    var a = [];
    if (imgs(p).length) { a.push(plural(imgs(p).length, 'piece', 'pieces')); }
    if (vids(p).length) { a.push(plural(vids(p).length, 'film', 'films')); }
    return a.join(' · ');
  }
  function kindOf(p) { return imgs(p).length && vids(p).length ? 'mix' : (vids(p).length ? 'film' : 'design'); }
  function kindLabel(p) { var k = kindOf(p); return k === 'mix' ? 'Design + film' : (k === 'film' ? 'Film' : 'Design'); }
  function posters(p) {   // playlist order; ids without a poster are skipped
    var out = [], v = vids(p), i;
    for (i = 0; i < v.length; i++) { if (p.posters && p.posters[v[i]]) { out.push(p.posters[v[i]]); } }
    return out;
  }
  // ponytail: a design project with a single frame is, in this fixture, one long Behance strip (91-132px wide at 760 tall):
  // a sliver in the viewer and a meaningless crop as a thumb. Those projects use the loud 808x632 cover instead.
  // Upgrade path: ship frame width/height in the fixture and test the ratio instead of the count.
  function stills(p) {
    var f = p.frames || [];
    return f.length >= 2 ? f : (imgs(p).length && p.cover ? [p.cover] : f);
  }
  function framesOf(p) {  // film -> posters, design -> frames, mixed -> frames then posters, nothing -> cover
    var out = stills(p).concat(posters(p));
    return out.length ? out : [p.cover];
  }
  function thumbOf(p) { return (kindOf(p) === 'film' ? posters(p)[0] : stills(p)[0]) || p.cover || framesOf(p)[0]; }
  function usable(p) { return !!framesOf(p)[0]; }   // no cover, no frames, no posters: nothing to show, so no row
  function matchesFilter(p, f) {   // a mixed project matches both
    return f === 'all' || (f === 'film' && vids(p).length > 0) || (f === 'design' && imgs(p).length > 0);
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ---------- curated order ---------- */
  var bySlug = {}, ORDER = [], FR = [], idxOf = {}, totals = { projects: WORK.length, pieces: 0, films: 0 }, i, p;
  for (i = 0; i < WORK.length; i++) { bySlug[WORK[i].slug] = WORK[i]; totals.pieces += imgs(WORK[i]).length; totals.films += vids(WORK[i]).length; }
  for (i = 0; i < FEATURED.length; i++) { p = bySlug[FEATURED[i]]; if (p && usable(p)) { ORDER.push(p); } }
  for (i = 0; i < WORK.length; i++) { if (ORDER.indexOf(WORK[i]) < 0 && usable(WORK[i])) { ORDER.push(WORK[i]); } }
  if (!ORDER.length) { return; }
  for (i = 0; i < ORDER.length; i++) { idxOf[ORDER[i].slug] = i; FR[i] = framesOf(ORDER[i]); }

  /* ---------- build ---------- */
  function img(src) { return '<img src="' + esc(src) + '" alt="" loading="lazy" decoding="async">'; }
  function rowHTML(p, n) {

    for (j = 0; j < ps.length; j++) { strip += '<i>' + img(ps[j]) + '</i>'; }

    return '<li class="vw2-item"><button type="button" class="vw2-row" data-slug="' + esc(p.slug) + '" data-cursor="Open" aria-label="Open ' + esc(p.title) + '" aria-describedby="vw2-m-' + n + '">' +
      '<span class="vw2-grid">' +
        '<span class="vw2-num">' + pad2(n + 1) + '</span>' +
        '<span class="vw2-thumb' + (k === 'film' ? ' vw2-t-film' : '') + '">' + img(thumbOf(p)) + '</span>' +
        '<span class="vw2-txt"><span class="vw2-title">' + esc(p.title) + '</span>' +
          '<span class="vw2-meta" id="vw2-m-' + n + '"><span class="vw2-kind vw2-k-' + k + '">' + esc(kindLabel(p)) + '</span><span class="vw2-count">' + esc(countLabel(p)) + '</span></span>' +
        '</span>' +
        '<span class="vw2-strip">' + strip + '</span>' +
        '<span class="vw2-arrow">' + ARROW + '</span>' +
      '</span></button></li>';
  }

  var list = root.querySelector('.vw2-list');
  var statusEl = root.querySelector('.vw2-status');
  var chips = root.querySelectorAll('.vw2-chip');
  var el = { mon: root.querySelector('.vw2-mon'), monIn: root.querySelector('.vw2-mon-in'), kind: q('kind'), ctr: q('ctr'), viewer: q('viewer'),
    back: q('back'), main: q('main'), sideL: q('sidel'), sideR: q('sider'), flash: q('flash'), clips: q('clips'), capl: q('capl'), num: q('num'),
    title: q('title'), tags: q('tags'), count: q('count'), open: q('open'), ph: null };
  var hasIO = 'IntersectionObserver' in window;
  var animate = hasIO && !mqRed.matches;
  if (animate) { root.classList.add('vw2-anim'); }

  // clip length means something: a 12-frame project is a long clip, a single title card a short one
  function grow(j) { return Math.max(2, FR[j].length); }
  var html = '', segHTML = '', segX = [], SEG_GAP = 3, growSum = 0, growAt = 0, frac;   // SEG_GAP mirrors .vw2-clips{gap:3px}
  for (i = 0; i < ORDER.length; i++) { growSum += grow(i); }
  for (i = 0; i < ORDER.length; i++) {
    html += rowHTML(ORDER[i], i);
    segHTML += '<span class="vw2-seg vw2-k-' + kindOf(ORDER[i]) + '" data-slug="' + esc(ORDER[i].slug) + '" data-cursor="Open" style="flex-grow:' + grow(i) + '"><i></i></span>';
    // centre of segment i = its share of the flexible width + the fixed gaps before it: pure arithmetic, no layout read
    frac = (growAt + grow(i) / 2) / growSum;
    segX[i] = 'translateX(' + (frac * 100).toFixed(3) + '%) translateX(' + (SEG_GAP * i - frac * SEG_GAP * (ORDER.length - 1)).toFixed(2) + 'px)';
    growAt += grow(i);
  }
  list.innerHTML = html;
  el.clips.innerHTML = segHTML + '<span class="vw2-ph"></span>';   // one travelling playhead, last child so segs[] indexes stay 0..n-1
  var items = list.children, segs = el.clips.children;
  el.ph = el.clips.lastChild;

  var nEls = root.querySelectorAll('[data-vw2-n]');
  for (i = 0; i < nEls.length; i++) { nEls[i].textContent = totals[nEls[i].getAttribute('data-vw2-n')]; }

  /* ---------- self-checks (dev aid; silent when healthy) ---------- */
  if (window.console && console.assert) {
    console.assert(countLabel({ images: new Array(12), videos: [] }) === '12 pieces', 'vw2: countLabel plural pieces');
    console.assert(countLabel({ images: [1], videos: [] }) === '1 piece', 'vw2: countLabel singular piece');
    console.assert(countLabel({ images: [], videos: new Array(8) }) === '8 films', 'vw2: countLabel films');
    console.assert(countLabel({ images: [1], videos: [1, 2] }) === '1 piece · 2 films', 'vw2: countLabel mixed needs both halves');
    console.assert(framesOf({ images: [1], frames: ['strip'], cover: 'c', videos: [] })[0] === 'c', 'vw2: a lone strip frame must fall back to the cover');
    console.assert(framesOf({ images: [], videos: ['a'], posters: { a: 'p' }, cover: 'c' })[0] === 'p', 'vw2: film frames are posters only');
    (function () {
      var seen = {}, n = 0, rows = list.querySelectorAll('.vw2-row'), j, s;
      for (j = 0; j < rows.length; j++) { s = rows[j].getAttribute('data-slug'); if (!seen[s]) { seen[s] = 1; n++; } }
      console.assert(n === WORK.length && rows.length === WORK.length, 'vw2: expected ' + WORK.length + ' unique slugs rendered, got ' + n);
    })();
  }

  /* ---------- monitor: race-safe hard cuts ---------- */
  // markSlug = the highlighted row / clip (tracks its source immediately); activeSlug = the project loaded in the monitor.
  var activeSlug = null, markSlug = null, curF = 0, token = 0, pendingCut = false, flipTimer = 0, visible = !hasIO, live = false;
  var stickyTop = 96, monH = 0;
  var preload = new Image();

  function canPlay() { return visible && !document.hidden && !mqRed.matches && mqDesk.matches; }
  function setLive(on) {   // the lime dot pulses only while frames are really cutting
    if (on === live) { return; }
    live = on;
    if (on) { el.monIn.classList.add('vw2-live'); } else { el.monIn.classList.remove('vw2-live'); }
  }
  function setCounter() {
    var n = idxOf[activeSlug], len = FR[n].length;
    // reduced motion shows frame 1 only, so the counter must not promise playback
    el.ctr.textContent = mqRed.matches ? pad2(len) + (len === 1 ? ' FRAME' : ' FRAMES') : 'FRAME ' + pad2(curF + 1) + ' / ' + pad2(len);
    segs[n].style.setProperty('--p', String((curF + 1) / len));
  }
  function show(src, k, im) {
    var tk = token, fr = FR[idxOf[activeSlug]], n = fr.length;

    function unblank() { if (tk === token) { el.viewer.classList.remove('vw2-blank'); } }
    el.main.onload = unblank;
    el.main.setAttribute('src', src);
    el.back.setAttribute('src', src);

    items[idxOf[slug]].classList.add('vw2-on'); segs[idxOf[slug]].classList.add('vw2-on');

    el.title.textContent = pr.title;
    el.tags.textContent = (pr.tags || []).join(' · ');
    el.count.textContent = countLabel(pr);
    el.kind.textContent = kindLabel(pr);
    el.kind.className = 'vw2-kind vw2-k-' + kindOf(pr);

    el.open.setAttribute('aria-label', 'Open project: ' + pr.title);   // keeps the visible words inside the accessible name

    el.viewer.classList.add('vw2-blank');
    if (had && !mqRed.matches) { replay(el.flash, 'vw2-go', el.capl, 'vw2-swap'); }
    cut(FR[n][0], 0, function (ok) { if (!ok && pr.cover) { show(pr.cover, 0, null); } schedule(); });
  }

  /* ---------- activation: keyboard focus > pointer (90ms intent) > scroll position ---------- */
  var focusSlug = null, hoverSlug = null, pendSlug = null, scrollSlug = ORDER[0].slug, pendLoad = null;
  var hoverTimer = 0, settleT = 0, lastScroll = 0, focusAt = 0, lastX = -1, lastY = -1, kb = false, raf = 0;

  function firstShown() { for (var j = 0; j < items.length; j++) { if (!items[j].hidden) { return ORDER[j].slug; } } return null; }
  function shown(s) { return s && !items[idxOf[s]].hidden ? s : null; }
  // Focus and hover load the monitor at once. The scroll source marks its row at once but only loads the monitor after the
  // candidate has held for SETTLE_MS: a Page Down / fling sweeps the highlight down the list without strobing 12 projects
  // (flash + blackout + image request each) through a 600px viewer. now=true skips the wait (filter swap, settle commit).
  function resolve(now) {
    if (!mqDesk.matches) { return; }   // no monitor below the desktop query: load nothing, mark nothing
    var direct = shown(focusSlug) || shown(hoverSlug), s = direct || shown(scrollSlug) || firstShown();
    if (!s) {   // a filter that matches nothing: never leave a hidden project on the monitor
      clearTimeout(settleT); clearTimeout(flipTimer); flipTimer = 0; pendLoad = null;
      if (activeSlug !== null) { token++; pendingCut = false; activeSlug = null; setLive(false); el.viewer.classList.add('vw2-blank'); }
      return;
    }
    mark(s);
    if (s === activeSlug) { clearTimeout(settleT); pendLoad = null; return; }
    if (direct || now === true || activeSlug === null) { clearTimeout(settleT); pendLoad = null; load(s); return; }
    if (s !== pendLoad) { pendLoad = s; clearTimeout(settleT); settleT = setTimeout(commit, SETTLE_MS); }
  }
  function commit() { pendLoad = null; resolve(true); }
  // The playhead line starts at 45% of the viewport and eases down to the monitor's bottom edge as the list
  // runs out, so the last rows still get their turn while the sticky monitor is fully docked (a fixed 45%
  // line would only reach them after the monitor had been pushed half off-screen).
  // monH only ever grows between resizes, and a new row must beat the current one by HYST_PX: the monitor's own
  // height can no longer feed back into the line and make two neighbouring rows alternate.
  // ponytail: reads 13 rects per scrolled frame; cache offsets if the list ever grows past ~50 rows.
  function computeScroll() {
    var vh = window.innerHeight, base = vh * 0.45, lr = list.getBoundingClientRect();
    monH = Math.max(monH, el.mon.offsetHeight);
    var need = Math.min(stickyTop + monH, vh * 0.9), span = lr.height - (need - base), line = base;
    var best = null, bestD = 1e9, curD = -1, j, r, d;
    if (need > base && span > 0) { line = base + clamp01((base - lr.top) / span) * (need - base); }
    for (j = 0; j < items.length; j++) {
      if (items[j].hidden) { continue; }
      r = items[j].getBoundingClientRect();
      d = Math.abs((r.top + r.bottom) / 2 - line);
      if (ORDER[j].slug === scrollSlug) { curD = d; }
      if (d < bestD) { bestD = d; best = ORDER[j].slug; }
    }
    if (best && (curD < 0 || curD - bestD > HYST_PX)) { scrollSlug = best; }
  }
  function tick() {
    raf = 0;
    if (!visible || !mqDesk.matches) { sync(); return; }
    computeScroll();
    resolve();      // touches the DOM only when the marked / loaded slug really changed
    sync();
  }
  function kick() { if (!raf) { raf = window.requestAnimationFrame(tick); } }
  function dropHover() { clearTimeout(hoverTimer); hoverSlug = null; pendSlug = null; list.classList.remove('vw2-hov'); }

  function slugFrom(t) {
    while (t && t !== root) {
      if (t.getAttribute && t.getAttribute('data-slug')) { return t.getAttribute('data-slug'); }
      t = t.parentNode;
    }
    return null;
  }
  // Only real pointer travel counts: browsers fire a synthetic mousemove after a scroll (same coordinates),
  // which would otherwise make hover and scroll fight each other while the host is still easing the page.
  function onMove(e) {
    if (!mqDesk.matches || (e.clientX === lastX && e.clientY === lastY)) { return; }
    lastX = e.clientX; lastY = e.clientY;
    if (focusSlug !== null) { focusSlug = null; kick(); }   // real pointer input releases the keyboard-focus claim
    var s = slugFrom(e.target), inList = list.contains(e.target);
    if (s === pendSlug) { return; }
    clearTimeout(hoverTimer);
    pendSlug = s;
    if (!s) { return; }
    hoverTimer = setTimeout(function () {
      if (Date.now() - lastScroll < 140) { pendSlug = null; return; }   // page still moving: scroll stays in charge
      hoverSlug = s;
      if (inList) { list.classList.add('vw2-hov'); }   // siblings dim only now: never from a parked pointer during a scroll
      resolve();
    }, inList ? INTENT_MS : SEG_INTENT_MS);   // clip segments sit on the way to "Open project": they need a real dwell
  }
  // Leaving cancels a pending intent. The project already on the monitor stays put until the next scroll,
  // so crossing the gutter to press "Open project" never swaps the project out from under the cursor.
  function onLeave() { clearTimeout(hoverTimer); pendSlug = null; list.classList.remove('vw2-hov'); }
  list.addEventListener('mousemove', onMove);
  list.addEventListener('mouseleave', onLeave);
  el.clips.addEventListener('mousemove', onMove);
  el.clips.addEventListener('mouseleave', onLeave);

  root.addEventListener('keydown', function () { kb = true; });
  root.addEventListener('mousedown', function () { kb = false; });
  root.addEventListener('focusin', function (e) {
    var s = slugFrom(e.target), viaKeys = false;
    if (s) {
      try { viaKeys = e.target.matches(':focus-visible'); } catch (err) { viaKeys = kb; }
      focusSlug = viaKeys ? s : null;
      focusAt = Date.now();
    } else if (!el.mon.contains(e.target)) {
      focusSlug = null;   // focus moving from a row into the monitor keeps that row's project loaded
    }
    resolve();
  });
  root.addEventListener('focusout', function (e) {
    if (!e.relatedTarget || !root.contains(e.relatedTarget)) { focusSlug = null; resolve(); }
  });

  window.addEventListener('scroll', function () {
    if (!visible || !mqDesk.matches) { return; }   // off-screen or no monitor: not even a rAF
    lastScroll = Date.now();
    // Focus priority is temporary. The grace lets the browser's own scroll-into-view after a Tab finish; any later
    // scroll (arrows, Page Down, trackpad, the host's eased scroll) hands the monitor back to the scroll position.
    if (focusSlug !== null && lastScroll - focusAt > FOCUS_GRACE_MS) { focusSlug = null; }
    if (hoverSlug !== null || pendSlug !== null) { dropHover(); }
    kick();
  }, { passive: true });
  window.addEventListener('resize', function () { measure(); kick(); });
  document.addEventListener('visibilitychange', sync);

  /* ---------- open: rows, clip segments, viewer and the primary button — always one step ---------- */
  root.addEventListener('click', function (e) {
    var t = e.target, s = null;
    while (t && t !== root && !s) {
      if (t.getAttribute) { s = t.getAttribute('data-slug') || (t.hasAttribute('data-vw2-open') ? activeSlug : null); }
      t = t.parentNode;
    }
    if (s && typeof window.__vbOpenProject === 'function') { window.__vbOpenProject(s); }
  });

  /* ---------- filter: 120ms out, swap [hidden], <=180ms in ---------- */
  var current = 'all', swapTimer = 0, enterIO = null, monIO = null, firstBatch = true;
  function countFor(f) { var n = 0, j; for (j = 0; j < ORDER.length; j++) { if (matchesFilter(ORDER[j], f)) { n++; } } return n; }
  function setStatus() { statusEl.textContent = 'Showing ' + countFor(current) + ' of ' + ORDER.length + ' projects'; }
  function swap() {
    var j, row, k = 0, on;
    for (j = 0; j < items.length; j++) {
      on = matchesFilter(ORDER[j], current);
      row = items[j].firstChild;
      items[j].hidden = !on;
      if (on) { segs[j].classList.remove('vw2-off'); } else { segs[j].classList.add('vw2-off'); }
      row.classList.add('vw2-notrans');      // rows that never played their entrance just appear: no .8s rise inside a 300ms budget
      row.classList.add('vw2-in');
      row.classList.remove('vw2-fin');
      row.style.transitionDelay = '';
    }
    void list.offsetWidth;
    for (j = 0; j < items.length; j++) {
      row = items[j].firstChild;
      row.classList.remove('vw2-notrans');
      if (items[j].hidden) { continue; }
      row.style.animationDelay = (Math.min(k, 5) * 12) + 'ms';   // 60ms of stagger + 120ms fade = 180ms
      row.classList.add('vw2-fin');
      k++;
    }
    list.classList.remove('vw2-out');
    setStatus();
    dropHover();
    if (mqDesk.matches) { computeScroll(); }
    resolve(true);
  }
  function applyFilter(f) {
    var j;
    if (f === current) { if (f === 'all') { return; } f = 'all'; }   // a pressed toggle releases back to All
    current = f;
    for (j = 0; j < chips.length; j++) { chips[j].setAttribute('aria-pressed', chips[j].getAttribute('data-f') === f ? 'true' : 'false'); }
    clearTimeout(swapTimer);
    if (mqRed.matches) { swap(); return; }
    list.classList.add('vw2-out');
    // ponytail: the list simply gets shorter; the chips sit above it, so nothing the user is looking at moves.
    swapTimer = setTimeout(swap, 120);
  }
  for (i = 0; i < chips.length; i++) {
    chips[i].querySelector('b').textContent = countFor(chips[i].getAttribute('data-f'));
    chips[i].addEventListener('click', function () { applyFilter(this.getAttribute('data-f')); });
  }
  setStatus();

  /* ---------- observers: pause everything off-screen; one-shot entrances ---------- */
  if (hasIO) {
    new IntersectionObserver(function (es) {
      visible = es[es.length - 1].isIntersecting;
      if (visible) { kick(); } else { sync(); }
    }, { rootMargin: '150px 0px 150px 0px' }).observe(root);
  }
  if (animate) {
    enterIO = new IntersectionObserver(function (es) {
      var k = firstBatch && mqDesk.matches ? 2 : 0, rows = 0, j, t, row;   // on desktop the monitor lands first, the list cascades after it
      for (j = 0; j < es.length; j++) {
        if (!es[j].isIntersecting) { continue; }
        t = es[j].target;
        enterIO.unobserve(t);
        if (t.parentNode === list) {
          row = t.firstChild;
          rows++;
          if (!row.classList.contains('vw2-in')) { row.style.transitionDelay = (k * 60) + 'ms'; row.classList.add('vw2-in'); k++; }
        } else {
          t.classList.add('vw2-in');
        }
      }
      if (rows) { firstBatch = false; }
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.01 });
    enterIO.observe(root.querySelector('.vw2-head-top'));   // each block triggers on its own: nothing finishes below the fold
    enterIO.observe(root.querySelector('.vw2-bar'));
    for (i = 0; i < items.length; i++) { enterIO.observe(items[i]); }
    // the monitor waits until a third of it is on screen, then "powers on" with the same exposure flash the cuts use
    monIO = new IntersectionObserver(function (es) {
      for (var j = 0; j < es.length; j++) {
        if (!es[j].isIntersecting) { continue; }
        monIO.disconnect();
        el.monIn.classList.add('vw2-in');
        setTimeout(function () { if (!mqRed.matches && activeSlug !== null) { replay(el.flash, 'vw2-go'); } }, 650);
        return;
      }
    }, { threshold: 0.35 });
    monIO.observe(el.monIn);
  }

  measure();
  resolve();   // first row is loaded from the start: the monitor is never empty
  kick();
})();
</script>
